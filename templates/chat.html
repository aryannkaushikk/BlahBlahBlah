<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../static/chat.css" />
    <title>Chat Room</title>
  </head>
  <body>
    <div
      class="offcanvas offcanvas-end"
      
      tabindex="-1"
      id="offcanvasWithBothOptions"
      aria-labelledby="offcanvasWithBothOptionsLabel"
    >
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvasWithBothOptionsLabel">User</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div>
      <div class="offcanvas-body d-flex flex-column-reverse">
        <button class="btn btn-outline-danger my-2" id="leave_room">
          Leave Room
        </button>
        <button class="btn btn-outline-warning my-2" id="change_room">
          Change Room
        </button>
      </div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div
        class="container-fluid d-flex justify-content-between align-items-center"
      >
        <div>
          <div class="dropdown">
            <button
              class="btn btn-dark dropdown-toggle"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              Users
            </button>
            <ul class="dropdown-menu dropdown-menu-dark"></ul>
          </div>
        </div>

        <h2
          class="text-white position-absolute top-50 start-50 translate-middle m-0"
        >
          Chat Room
        </h2>

        <div>
          <button
            class="btn btn-outline-light"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#offcanvasWithBothOptions"
            aria-controls="offcanvasWithBothOptions"
          >
            ☰
          </button>
        </div>
      </div>
    </nav>

    <main style="position: relative;" class="p-3 overflow-auto"
    id="chat-box">
    </main>

    <div id="input-bar"
        class="d-flex flex-column start-0 bottom-0 end-0 p-3 fixed-bottom" style="background-color: white;"
      >
        <div id="typing" class="" style="min-height: 1.5em"></div>
        
        <form class="d-flex">
          <textarea
          id="chat-input"
          class="form-control me-3"
          placeholder="Type a message..."
          rows="1"
          style="resize: none; overflow-y: auto;"
          ></textarea>
          <button
            class="btn btn-outline-success d-flex align-items-center gap-1"
            type="submit"
          >
            <span>Send</span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-send-fill"
              viewBox="0 0 16 16"
            >
              <path
                d="M15.964.686a.5.5 0 0 0-.65-.65L.767 5.855H.766l-.452.18a.5.5 0 0 0-.082.887l.41.26.001.002 4.995 3.178 3.178 4.995.002.002.26.41a.5.5 0 0 0 .886-.083zm-1.833 1.89L6.637 10.07l-.215-.338a.5.5 0 0 0-.154-.154l-.338-.215 7.494-7.494 1.178-.471z"
              />
            </svg>
          </button>
        </form>
      </div>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="../static/chat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
  </body>
</html>

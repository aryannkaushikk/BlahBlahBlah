<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <title>Join - ChatApp</title>
</head>
<body class="d-flex align-items-center py-4 bg-body-tertiary">

    <div class="form-signin w-100 m-auto">
        <form method="post">
          <h1 class="h3 mb-3 fw-normal my-5">Please Enter UserName</h1>
      
          <div class="form-floating my-5">
            <input type="text" class="form-control" id="userNameInput" name="username" placeholder="">
            <label for="userNameInput">UserName</label>
          </div>

          <div class="form-floating my-5">
            <input type="text" class="form-control" id="roomNameInput" name="roomname" placeholder="">
            <label for="roomNameInput">Room Name</label>
          </div>
      
          <button class="btn btn-outline-dark w-100 py-2 my-5" type="submit">Go to Chat</button>
        </form>
    </div>
    <script>

      window.onload = () => {
        document.querySelector("form #userNameInput").focus();
      };

      const form = document.querySelector('form');
      const userNameInput = document.querySelector('#userNameInput');
      const roomNameInput = document.querySelector('#roomNameInput');
      form.addEventListener('submit', ()=>{
        const username = userNameInput.value;
        const roomname = roomNameInput.value;
        localStorage.setItem("username",username);
        localStorage.setItem("roomname", roomname);
      });
    </script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</body>
</html>

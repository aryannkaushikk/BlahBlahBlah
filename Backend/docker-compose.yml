version: '3.8'

services:
  room_service:
    build:
      context: ./room_service
      dockerfile: Dockerfile
    container_name: room_service
    ports:
      - "5800:5800"
    networks:
      - chat_network

  message_service:
    build:
      context: ./message_service
      dockerfile: Dockerfile
    container_name: message_service
    ports:
      - "5600:5600"
    networks:
      - chat_network

  chat_service:
    build:
      context: ./chat_service
      dockerfile: Dockerfile
    container_name: chat_service
    ports:
      - "8080:8080"
    depends_on:
      - room_service
      - message_service
    networks:
      - chat_network

networks:
  chat_network:
    driver: bridge

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <title>Unauthorized Access</title>
</head>
<body
    style="
      height: 100vh;
      display: flex;
      flex-direction: column;
      border: 1px solid black;
      justify-content: center;
      align-items: center;
    "
  >
    <div
      style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 50%;
      "
    >
      <h1 style="color: red;">Error: 401</h1>
      <br />
      <h3 style="text-align: center; font-weight: normal;">You are not authorized. <br><br>This could be due to missing or invalid or expired token. <br><br><br> Please Sign Up or Login to proceed</h3>
      <br><br>
      <button class="btn btn-dark" style="width: 100%" id="btn">
        Login / SignUp
      </button>
      <br />
    </div>
    <script>
        const button = document.getElementById("btn");

        button.addEventListener('click', ()=>{
            window.location.href = '/';
        });
    </script>
</body>
</html>

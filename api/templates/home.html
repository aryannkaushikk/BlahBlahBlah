<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <title>Welcome to BlahBlahBlah</title>
  </head>
  <body
    style="
      height: 100vh;
      display: flex;
      flex-direction: column;
      border: 1px solid black;
      justify-content: center;
      align-items: center;
    "
  >
    <div
      style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 50%;
      "
    >
      <h1>Welcome</h1>
      <br /><br />
      <button class="btn btn-primary" style="width: 100%" id="google-login">
        Continue with Google
      </button>
      <br />
      <h3>OR</h3>

      <div style="width: 100%">
        <div class="mb-3">
          <label for="email" class="form-label"
            >Email address</label
          >
          <input
            type="email"
            class="form-control"
            id="email"
            aria-describedby="emailHelp"
          />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
          />
        </div>
        
        <div style="width: 100%; color: Red;" id="errMsg"></div>
        <br>
        <div style="display: flex; justify-content: space-between">
          <button
            type="button"
            class="btn btn-dark"
            style="width: 100%; margin-right: 3%"
            id="email-signup"
          >
            SignUp
          </button>
          <button
            type="button"
            class="btn btn-dark"
            style="width: 100%; margin-left: 3%"
            id="email-login"
          >
            Login
          </button>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js" type="module"></script>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
      import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword
      } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";      
      
      const firebaseConfig = {
        apiKey: "AIzaSyAQptlUxQU9-mph61V6RXiFqVBxFQMzImU",
        authDomain: "chat-app-275c4.firebaseapp.com",
        projectId: "chat-app-275c4",
        storageBucket: "chat-app-275c4.firebasestorage.app",
        messagingSenderId: "1021810476046",
        appId: "1:1021810476046:web:c821768c5eeb1ed1e0685f"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth();

      // Google login
    document.getElementById("google-login").onclick = () => {
      const provider = new GoogleAuthProvider(); 
      signInWithPopup(auth, provider)
        .then(result => result.user.getIdToken())
        .then(idToken => {
          window.location.href = "/room";
        })
        .catch(error => {
          let msg = '';
          if (error.code === "auth/user-not-found") {
            msg = "User does not exist.";
          } else if (error.code === "auth/wrong-password") {
            msg = "Incorrect password.";
          } else if (error.code === "auth/invalid-email") {
            msg = "Invalid email format.";
          } else {
            msg = "Unexpected error.";
            console.error("Unexpected error:", error);
          }
          errorCreate(msg);
        });
    };

    // Email signup
    document.getElementById("email-signup").onclick = () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      createUserWithEmailAndPassword(auth, email, password)
        .then(userCred => userCred.user.getIdToken())
        .then(idToken => {
          window.location.href = "/room";        
        })
        .catch(error => {
          let msg = "";
          if (error.code === "auth/email-already-in-use") {
            msg = "Email already in use.";
          } else if (error.code === "auth/weak-password") {
            msg = "Weak Password.";
          } 
          else {
            msg = "Unexpected error.";
            console.error("Unexpected error:", error);
          }
          errorCreate(msg);
        });
    };

    // Email login
    document.getElementById("email-login").onclick = () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      signInWithEmailAndPassword(auth, email, password)
        .then(userCred => userCred.user.getIdToken())
        .then(idToken => {
          window.location.href = "/room";
        })
        .catch(error => {
          let msg = '';
          if (error.code === "auth/user-not-found") {
            msg = "User does not exist.";
          } else if (error.code === "auth/wrong-password") {
            msg = "Incorrect password.";
          } else if (error.code === "auth/invalid-email") {
            msg = "Invalid email format.";
          } else if (error.code === "auth/invalid-login-credentials") {
            msg = "Invalid email or password.";
          } else {
            msg = "Unexpected error.";
          }
          errorCreate(msg);
        });
    };

    function errorCreate(msg) {
      const errMsg = document.getElementById('errMsg');
      errMsg.innerText = msg;
    }
    </script>

  </body>
</html>

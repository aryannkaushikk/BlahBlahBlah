<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <title>Welcome to BlahBlahBlah</title>
  </head>
  <body
    style="
      height: 100vh;
      display: flex;
      flex-direction: column;
      border: 1px solid black;
      justify-content: center;
      align-items: center;
    "
  >
    <div
      style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 50%;
      "
    >
      <h1>Welcome</h1>
      <br /><br />
      <button class="btn btn-primary" style="width: 100%" id="google-login">
        Continue with Google
      </button>
      <br />
      <h3>OR</h3>

      <div style="width: 100%" id="info">
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input
            type="email"
            class="form-control"
            id="email"
            aria-describedby="emailHelp"
          />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" />
        </div>

        <div style="width: 100%; color: Red" id="errMsg"></div>
        <br />
        <div style="display: flex; justify-content: space-between">
          <button
            type="button"
            class="btn btn-dark"
            style="width: 100%; margin-right: 3%"
            id="email-login"
          >
            Login
          </button>
          <button
            type="button"
            class="btn btn-dark"
            style="width: 20%;"
            id="switch"
          >
            &#x21c4; <!-- ⇄ --> 
          </button>
          <button
            type="button"
            class="btn btn-dark"
            style="width: 100%; margin-left: 3%"
            id="email-signup"
            disabled
          >
            SignUp
          </button>
        </div>
      </div>
    </div>

    <script
      src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"
      type="module"
    ></script>
    <script
      src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js"
      type="module"
    ></script>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
      import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        updateProfile
      } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAQptlUxQU9-mph61V6RXiFqVBxFQMzImU",
        authDomain: "chat-app-275c4.firebaseapp.com",
        projectId: "chat-app-275c4",
        storageBucket: "chat-app-275c4.firebasestorage.app",
        messagingSenderId: "1021810476046",
        appId: "1:1021810476046:web:c821768c5eeb1ed1e0685f",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth();

      let switchVar = 0;

      const info = document.getElementById("info");

      const nameDiv = document.createElement("div");
      nameDiv.className = "mb-3";
      nameDiv.innerHTML = `
        <label for="displayName" class="form-label">Name</label>
        <input
          type="text"
          class="form-control"
          id="displayName"
          aria-describedby="emailHelp"
        />
      `;

      document.getElementById("switch").addEventListener('click', () => {
        if(switchVar==0){
          switchVar = 1;
          document.getElementById("email-login").disabled = true;
          document.getElementById("email-signup").disabled = false; 
          info.prepend(nameDiv);
        }else{
          switchVar = 0;
          document.getElementById("email-login").disabled = false;
          document.getElementById("email-signup").disabled = true;
          nameDiv.remove();
        }
      });

      // Google login
      document.getElementById("google-login").onclick = () => {
        alertClear();
        const provider = new GoogleAuthProvider();
        signInWithPopup(auth, provider)
          .then((result) => result.user.getIdToken())
          .then((idToken) => {
            return fetch("http://localhost:5100/sessionLogin", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ idToken }),
              credentials: "include", // Send cookies
            });
          })
          .then((res) => {
            if (!res.ok) throw new Error("Session login failed");
            setTimeout(() => {
              alertCreate("Login Successful", "green");
            }, 500);
            window.location.href = "/room";
          })
          .catch((error) => {
            let msg = "";
            if (error.code === "auth/user-not-found") {
              msg = "User does not exist.";
            } else if (error.code === "auth/wrong-password") {
              msg = "Incorrect password.";
            } else if (error.code === "auth/invalid-email") {
              msg = "Invalid email format.";
            } else {
              msg = "Unexpected error.";
              console.error("Unexpected error:", error);
            }
            alertCreate(msg, "red");
          });
      };

      // Email signup
      document.getElementById("email-signup").onclick = () => {
  alertClear();
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const displayName = document.getElementById("displayName").value;

  if(!displayName){
    alertCreate('Enter Your Name Please.', 'red');
  }

  createUserWithEmailAndPassword(auth, email, password)
    .then((userCred) => {
      // Set display name in Firebase Auth profile
      return updateProfile(userCred.user, {
        displayName: displayName,
      }).then(() => userCred.user.getIdToken());
    })
    .then((idToken) => {
      return fetch("http://localhost:5100/sessionLogin", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ idToken }),
        credentials: "include",
      });
    })
    .then((res) => {
      if (!res.ok) throw new Error("Session login failed");
      setTimeout(() => {
        alertCreate("Signed Up Successfully", "green");
      }, 500);
      window.location.href = "/room";
    })
    .catch((error) => {
      let msg = "";
      if (error.code === "auth/email-already-in-use") {
        msg = "Email already in use.";
      } else if (error.code === "auth/weak-password") {
        msg = "Weak Password.";
      } else {
        msg = "Unexpected error.";
        console.error("Unexpected error:", error);
      }
      alertCreate(msg, "red");
          });
      };


      // Email login
      document.getElementById("email-login").onclick = () => {
        alertClear();
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        signInWithEmailAndPassword(auth, email, password)
          .then((userCred) => userCred.user.getIdToken())
          .then((idToken) => {
            return fetch("http://localhost:5100/sessionLogin", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ idToken }),
              credentials: "include",
            });
          })
          .then((res) => {
            if (!res.ok) throw new Error("Session login failed");
            setTimeout(() => {
              alertCreate("Login Successful", "green");
            }, 500);
            window.location.href = "/room";
          })
          .catch((error) => {
            let msg = "";
            if (error.code === "auth/user-not-found") {
              msg = "User does not exist.";
            } else if (error.code === "auth/wrong-password") {
              msg = "Incorrect password.";
            } else if (error.code === "auth/invalid-email") {
              msg = "Invalid email format.";
            } else if (error.code === "auth/invalid-login-credentials") {
              msg = "Invalid email or password.";
            } else {
              msg = "Unexpected error.";
              console.error("Unexpected error:", error);
            }
            alertCreate(msg, "red");
          });
      };

      function alertCreate(msg, type) {
        const errMsg = document.getElementById("errMsg");
        errMsg.style.color = type;
        errMsg.innerText = msg;
      }

      function alertClear() {
        const errMsg = document.getElementById("errMsg");
        errMsg.innerText = "";
      }
    </script>
  </body>
</html>

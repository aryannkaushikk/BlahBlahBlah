<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <title>BlahBlahBlah</title>
  </head>
  <body
    style="
      height: 100vh;
      display: flex;
      flex-direction: column;
      border: 1px solid black;
      justify-content: center;
      align-items: center;
    "
  >
    <div
      style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 50%;
      "
    >
      <h1>Join or Create Room</h1>
      <br /><br />
      <div
        style="
          width: 100%;
          display: flex;
          flex-direction: column;
          justify-content: center;
        "
      >
        <div style="display: flex; width: 100%">
          <div class="me-3" style="width: 100%">
            <label for="email" class="form-label">Room ID</label>
            <br />
            <input type="text" class="form-control" id="room-id" />
            <br />
            <button
              type="button"
              class="btn btn-dark"
              style="width: 100%"
              id="join-room"
            >
              Join Room
            </button>
          </div>

          <div style="width: 100%">
            <label for="room-name" class="form-label">Room Name</label>
            <br />
            <input type="text" class="form-control" id="room-name" />
            <br />
            <button
              type="button"
              class="btn btn-dark"
              style="width: 100%"
              id="create-room"
            >
              Create Room
            </button>
          </div>
        </div>
        <br />
        <div
          style="width: 100%; color: Red; text-align: center"
          id="errMsg"
        ></div>
      </div>
    </div>

    <script
      src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"
      type="module"
    ></script>
    <script
      src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js"
      type="module"
    ></script>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";

      import {
        getAuth,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAQptlUxQU9-mph61V6RXiFqVBxFQMzImU",
        authDomain: "chat-app-275c4.firebaseapp.com",
        projectId: "chat-app-275c4",
        storageBucket: "chat-app-275c4.firebasestorage.app",
        messagingSenderId: "1021810476046",
        appId: "1:1021810476046:web:c821768c5eeb1ed1e0685f",
      };

      const app = initializeApp(firebaseConfig);

      const auth = getAuth();

      localStorage.setItem("newJoin", 0);

      async function joinRoom(auth, rid) {
        const user = auth.currentUser;
        try {
          const token = await user.getIdToken();

          const response = await fetch(
            "https://blahblahblah.onrender.com/join_room",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + token,
              },
              body: JSON.stringify({ rid }),
            }
          );

          if (!response.ok) {
            const errorData = await response.json();
            alertCreate(errorData.error || "Failed to join room.", "red");
            return;
          }

          const data = await response.json();
          localStorage.setItem("rid", data.rid);
          localStorage.setItem("roomname", data.roomname);
          localStorage.setItem("uid", user.uid);
          localStorage.setItem("username", user.displayName);

          if (data.newJoin === 1) {
            localStorage.setItem("newJoin", 1);
          }
          alertCreate("Joined Room Successfully", "green");

          setTimeout(() => {
            window.location.href = "/chat";
          }, 1000);
        } catch (error) {
          console.error("ERROR:", error);
          alertCreate("Network error. Try again later.", "red");
        }
      }

      async function createRoom(auth, roomname) {
        const user = auth.currentUser;
        
        try {
          const token = await user.getIdToken();
          console.log("ID Token:", token);

          const response = await fetch(
            "https://blahblahblah.onrender.com/create_room",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + token,
              },
              body: JSON.stringify({ roomname }),
            }
          );

          if (!response.ok) {
            const errorData = await response.json();
            alertCreate(errorData.error || "Failed to create room.", "red");
            return;
          }

          const data = await response.json();
          localStorage.setItem("rid", data.rid);
          localStorage.setItem("roomname", data.roomname);
          localStorage.setItem("username", user.uid);
          localStorage.setItem("username", user.displayName);
          alertCreate("Created Room Successfully", "green");

          setTimeout(() => {
            window.location.href = "/chat";
          }, 1000);
        } catch (error) {
          alertCreate("Network error. Try again later.", "red");
        }
      }

      const join = document.getElementById("join-room");
      join.addEventListener("click", () => {
        const room = document.getElementById("room-id").value;
        if (room.trim() == "") {
          alertCreate("Enter Room ID", "red");
        } else {
          joinRoom(auth, room);
        }
      });

      const create = document.getElementById("create-room");
      create.addEventListener("click", () => {
        const room = document.getElementById("room-name").value;
        if (room.trim() == "") {
          alertCreate("Enter Room Name", "red");
        } else {
          createRoom(auth, room);
        }
      });

      function alertCreate(msg, type) {
        const errMsg = document.getElementById("errMsg");
        errMsg.style.color = type;
        errMsg.innerText = msg;
      }
    </script>
  </body>
</html>
